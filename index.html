<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울금융고 AI 해커톤 | 참가자 확인</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <style>
    /* ===== 기본 설정 ===== */
    :root {
      --lavender: #c9b8ff;
      --lavender-deep: #8f78f0;
      --pink: #ffc8dd;
      --pink-deep: #f28cb3;
      --mint: #c6f1e0;
      --mint-deep: #3fa87f;
      --peach: #ffe1cc;
      --peach-deep: #e0784a;
      --sky: #cde8ff;
      --text: #3f3a5a;
      --text-soft: #7b7699;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #f3edff 0%, #ffeef5 50%, #eafaf3 100%);
      overflow-x: hidden;
    }

    /* 배경에 둥둥 떠다니는 파스텔 동그라미 */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.55;
      z-index: 0;
      animation: float 9s ease-in-out infinite;
    }
    .blob.b1 { width: 220px; height: 220px; background: var(--lavender); top: -60px; left: -60px; }
    .blob.b2 { width: 160px; height: 160px; background: var(--pink); bottom: 8%; right: -40px; animation-delay: -3s; }
    .blob.b3 { width: 110px; height: 110px; background: var(--mint); top: 55%; left: 6%; animation-delay: -6s; }
    .blob.b4 { width: 80px; height: 80px; background: var(--sky); top: 12%; right: 12%; animation-delay: -1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.05); }
    }

    /* ===== 카드 ===== */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(143, 120, 240, 0.18);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--lavender-deep);
      background: #f1ecff;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .mascot {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 10px;
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    h1 {
      font-size: clamp(24px, 6.5vw, 30px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    h1 .highlight {
      background: linear-gradient(transparent 60%, var(--pink) 60%);
      padding: 0 4px;
    }

    .guide {
      font-size: 16px;
      color: var(--text-soft);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* ===== 입력 영역 ===== */
    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .name-input {
      width: 100%;
      padding: 16px 18px;
      font-size: 18px; /* 16px 이상이면 아이폰에서 화면이 확대되지 않아요 */
      font-family: inherit;
      text-align: center;
      color: var(--text);
      background: #faf8ff;
      border: 2px solid #e6dfff;
      border-radius: 18px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .name-input::placeholder {
      color: #b9b4cf;
    }

    .name-input:focus {
      border-color: var(--lavender-deep);
      box-shadow: 0 0 0 4px rgba(201, 184, 255, 0.45);
    }

    .name-input.invalid {
      border-color: var(--pink-deep);
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .error {
      min-height: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #d9578a;
      word-break: keep-all;
    }

    .check-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      font-family: inherit;
      color: var(--white);
      background: linear-gradient(135deg, var(--lavender-deep), var(--pink-deep));
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(242, 140, 179, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .check-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(242, 140, 179, 0.45);
    }

    .check-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* ===== 결과 영역 ===== */
    .result {
      display: none;
      margin-top: 22px;
      padding: 22px 20px;
      border-radius: 24px;
      animation: pop 0.4s ease-out;
    }

    .result.show {
      display: block;
    }

    .result.yes {
      background: var(--mint);
      border: 2px dashed #8fdcbc;
    }

    .result.no {
      background: var(--peach);
      border: 2px dashed #ffb894;
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); }
    }

    .result-emoji {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result.yes .result-title { color: var(--mint-deep); }
    .result.no .result-title { color: var(--peach-deep); }

    .result-msg {
      font-size: 16px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-soft);
    }

    /* ===== 축하 색종이 ===== */
    .confetti {
      position: fixed;
      top: -24px;
      z-index: 10;
      font-size: 22px;
      pointer-events: none;
      animation: fall var(--duration) linear forwards;
    }

    @keyframes fall {
      to {
        transform: translate(var(--drift), 110vh) rotate(var(--spin));
        opacity: 0.2;
      }
    }

    /* 작은 화면(스마트폰) */
    @media (max-width: 380px) {
      .card { padding: 28px 18px 22px; border-radius: 26px; }
      .mascot { font-size: 54px; }
      .guide { font-size: 15px; }
    }

    /* 움직임 줄이기 설정을 켠 사용자 배려 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <main class="card">
    <span class="badge">2026 · 11.17(화) ~ 11.18(수)</span>
    <div class="mascot" aria-hidden="true">🤖</div>
    <h1>서울금융고<br><span class="highlight">AI 해커톤</span></h1>
    <p class="guide">나는 해커톤 참가자일까? 🤔<br>이름을 입력하고 확인해 보세요!</p>

    <form class="form" id="checkForm" novalidate>
      <label for="nameInput" class="sr-only">이름</label>
      <input
        type="text"
        id="nameInput"
        class="name-input"
        placeholder="예) 홍길동"
        maxlength="10"
        autocomplete="off"
        aria-describedby="errorMsg"
      >
      <p class="error" id="errorMsg" role="alert"></p>
      <button type="submit" class="check-btn">확인하기 ✨</button>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="result-emoji" id="resultEmoji"></div>
      <p class="result-title" id="resultTitle"></p>
      <p class="result-msg" id="resultMsg"></p>
    </section>

    <p class="footer">문의 · 소프트웨어부</p>
  </main>

  <script>
    // ===== 1. 해커톤 참가 학생 명단 =====
    // 학생이 추가되거나 바뀌면 이 목록만 고치면 돼요. (가나다순)
    const participants = [
      "구민서", "권지오", "길희건", "김규민", "김규빈", "김동원", "김민건", "김민성",
      "김민준", "김수혁", "김시온", "김시은", "김용희", "문도영", "박세호", "백지훈",
      "석민산", "성시우", "성유경", "신지수", "신태빈", "안륜혜", "안승환", "안재민",
      "유시우", "유재석", "이건주", "이시우", "이여수룬", "이지호", "이찬민", "임승빈",
      "임종권", "임종혁", "장무아", "장준서", "장형동", "전성은", "정예준", "정하율",
      "조건우", "조민재", "주선평", "최우승", "현종현", "홍영택", "홍지혜"
    ];

    // ===== 2. 결과 멘트 (여러 개 중 하나가 랜덤으로 나와요) =====
    const yesMessages = [
      (name) => `${name}님은 해커톤 참가자가 맞아요! 팀원들과 힘을 모아 아이디어를 멋진 서비스로 만들어 보세요 💪`,
      (name) => `환영해요, ${name}님! 이틀 동안 열심히 참여해서 모두가 깜짝 놀랄 결과물을 보여 주세요 🚀`,
      (name) => `${name}님, 오늘의 주인공은 바로 당신! 끝까지 즐기면서 최고의 결과물을 만들어 봐요 🌟`
    ];

    const noMessages = [
      (name) => `앗, ${name}님은 명단에 없어요 🙈 지금쯤 선생님이 출석부를 들고 찾고 계실지도… 얼른 교실로 돌아가요! 🏃💨`,
      (name) => `삐빅! 🤖 ${name}님은 참가자가 아닙니다. AI도 수업 땡땡이는 못 봐줘요. 교실로 출발~!`,
      (name) => `${name}님, 몰래 구경 왔죠? 👀 수업이 ${name}님을 애타게 기다리고 있어요. 서운해하기 전에 어서 돌아가요! 📚`
    ];

    // ===== 3. 화면 요소 가져오기 =====
    const form = document.getElementById("checkForm");
    const nameInput = document.getElementById("nameInput");
    const errorMsg = document.getElementById("errorMsg");
    const result = document.getElementById("result");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultTitle = document.getElementById("resultTitle");
    const resultMsg = document.getElementById("resultMsg");

    // ===== 4. 입력값 검사 =====
    // 문제가 있으면 안내 문구를, 문제가 없으면 빈 문자열("")을 돌려줘요.
    function validateName(name) {
      if (name === "") {
        return "이름을 입력해 주세요! ✏️";
      }
      if (/[ㄱ-ㅎㅏ-ㅣ]/.test(name)) {
        return "글자가 덜 완성됐어요! 이름을 끝까지 입력해 주세요.";
      }
      if (/[^가-힣]/.test(name)) {
        return "이름은 한글로만 입력해 주세요! (영어·숫자·기호 X)";
      }
      if (name.length < 2) {
        return "이름은 2글자 이상 입력해 주세요!";
      }
      if (name.length > 6) {
        return "이름이 너무 길어요! 6글자 이하로 입력해 주세요.";
      }
      return "";
    }

    // ===== 5. 오류 / 결과 보여주기 =====
    function showError(message) {
      errorMsg.textContent = message;
      result.classList.remove("show");
      nameInput.classList.remove("invalid");
      void nameInput.offsetWidth; // 흔들림 애니메이션을 매번 다시 실행하기 위한 코드
      nameInput.classList.add("invalid");
      nameInput.focus();
    }

    function clearError() {
      errorMsg.textContent = "";
      nameInput.classList.remove("invalid");
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function showResult(isParticipant, name) {
      result.classList.remove("show", "yes", "no");
      void result.offsetWidth; // 등장 애니메이션을 매번 다시 실행하기 위한 코드

      if (isParticipant) {
        result.classList.add("show", "yes");
        resultEmoji.textContent = "🎉";
        resultTitle.textContent = "참가자가 맞아요!";
        resultMsg.textContent = pickRandom(yesMessages)(name);
        launchConfetti();
      } else {
        result.classList.add("show", "no");
        resultEmoji.textContent = "🙅";
        resultTitle.textContent = "참가자가 아니에요!";
        resultMsg.textContent = pickRandom(noMessages)(name);
      }

      // 다음 사람이 바로 입력할 수 있게 글자를 선택해 둬요.
      nameInput.select();
    }

    // ===== 6. 축하 색종이 효과 =====
    function launchConfetti() {
      const pieces = ["🎉", "✨", "💜", "💖", "⭐", "🎊", "💚"];
      for (let i = 0; i < 28; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.textContent = pickRandom(pieces);
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
        piece.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
        piece.style.setProperty("--duration", (1.8 + Math.random() * 1.4) + "s");
        piece.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    // ===== 7. 확인 버튼(또는 엔터)을 눌렀을 때 =====
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // 페이지가 새로고침되지 않게 막아요.

      // 앞뒤·중간 공백을 모두 지워요. 예) " 홍 길동 " → "홍길동"
      const name = nameInput.value.replace(/\s/g, "");

      const errorText = validateName(name);
      if (errorText) {
        showError(errorText);
        return;
      }

      clearError();
      const isParticipant = participants.includes(name);
      showResult(isParticipant, name);
    });

    // 다시 입력하기 시작하면 오류 문구를 지워요.
    nameInput.addEventListener("input", clearError);
  </script>
</body>
</html>
